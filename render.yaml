services:
  - type: web
    plan: free
    name: stash
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "python -m gunicorn config.wsgi:application"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      
      - key: DATABASE_URL
        sync: false

      - key: SECRET_KEY
        generateValue: true

      - key: ALLOWED_HOSTS
        sync: false
        
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
